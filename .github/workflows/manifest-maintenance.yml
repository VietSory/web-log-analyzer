name: Manifest Maintenance

on:
  push:
    branches:
      - portfolio-rebuild-workspace

permissions:
  contents: write

concurrency:
  group: manifest-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Append final product documentation entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/replay-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          additions = [
              {
                  'workspace_sha': '19d8e3c2d86c684f0c9cdabb15438b3e986b9b40',
                  'message': 'docs: publish production release runbook',
                  'author_date': '2026-06-01T20:57:00+07:00',
                  'committer_date': '2026-06-01T20:57:00+07:00',
                  'rationale': 'Replace internal publishing notes with a maintainer-facing production release and rollback procedure.',
                  'verification': ['documentation reviewed', 'covered by final workspace CI'],
              },
              {
                  'workspace_sha': '616982830a62fe686fc09efa590517a874a7f301',
                  'message': 'docs: align architecture with product release process',
                  'author_date': '2026-06-03T20:41:00+07:00',
                  'committer_date': '2026-06-03T20:41:00+07:00',
                  'rationale': 'Align architecture documentation with the actual product boundaries and release process.',
                  'verification': ['documentation reviewed', 'covered by final workspace CI'],
              },
              {
                  'workspace_sha': '293a8f31bb733cc721e51ab96de2e349c85de4c9',
                  'message': 'docs: align README with public product workflow',
                  'author_date': '2026-06-05T21:13:00+07:00',
                  'committer_date': '2026-06-05T21:13:00+07:00',
                  'rationale': 'Align public README with the final product layout, verification, and release workflow.',
                  'verification': ['documentation reviewed', 'covered by final workspace CI'],
              },
          ]
          by_sha = {entry['workspace_sha']: entry for entry in data['entries']}
          for entry in additions:
              existing = by_sha.get(entry['workspace_sha'])
              if existing is not None and existing != entry:
                  raise SystemExit(f"conflicting manifest entry for {entry['workspace_sha']}")
              if existing is None:
                  data['entries'].append(entry)
          if len(data['entries']) != 62:
              raise SystemExit(f"expected 62 replay entries, found {len(data['entries'])}")
          if data['entries'][-1]['workspace_sha'] != '293a8f31bb733cc721e51ab96de2e349c85de4c9':
              raise SystemExit('final replay entry is not the final product head')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit manifest bookkeeping
        run: |
          if git diff --quiet -- docs/replay-manifest.json; then
            echo 'Manifest already up to date.'
            exit 0
          fi
          git config user.name 'Vietsory'
          git config user.email '121284939+VietSory@users.noreply.github.com'
          git add docs/replay-manifest.json
          git commit -m 'chore: record final product documentation in replay manifest'
          git push origin HEAD:portfolio-rebuild-workspace
