name: Date Fix Verification

on:
  push:
    branches:
      - portfolio-rebuild-workspace

permissions:
  contents: read

jobs:
  replay:
    name: Rebuild irregular dated history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Compile helper
        run: python3 -m py_compile scripts/replay_datefix_v2.py

      - name: Rebuild and verify dated history
        run: python3 scripts/replay_datefix_v2.py

      - name: Verify count, metadata and active-day distribution
        run: |
          test "$(git rev-list --count 8b0e3c6b9dfe1c0e6f7f41cc6c2d98683ad06e2c..portfolio-rebuild-dated-v2)" -eq 62
          test "$(git log --format='%ad' --date=format-local:'%Y-%m-%d' 8b0e3c6b9dfe1c0e6f7f41cc6c2d98683ad06e2c..portfolio-rebuild-dated-v2 | sort -u | wc -l)" -eq 55
          git log --reverse --format='%aI | %cI | %ae | %s' 8b0e3c6b9dfe1c0e6f7f41cc6c2d98683ad06e2c..portfolio-rebuild-dated-v2
