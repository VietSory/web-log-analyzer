name: Replay Verification

on:
  push:
    branches:
      - portfolio-rebuild-workspace

permissions:
  contents: read

concurrency:
  group: replay-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Reconstruct dated history
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete workspace history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Recover workspace-only replay helper
        run: |
          git show fd285863ad4df96abd08a26396bd2631460b135d:scripts/replay_dated_history.py > "${RUNNER_TEMP}/replay_dated_history.py"
          python -m py_compile "${RUNNER_TEMP}/replay_dated_history.py"

      - name: Validate manifest against final product head
        run: |
          python "${RUNNER_TEMP}/replay_dated_history.py" \
            --skip-fetch \
            --workspace-ref 293a8f31bb733cc721e51ab96de2e349c85de4c9

      - name: Reconstruct and verify dated history
        run: |
          git fetch origin main:refs/remotes/origin/main
          python "${RUNNER_TEMP}/replay_dated_history.py" \
            --skip-fetch \
            --workspace-ref 293a8f31bb733cc721e51ab96de2e349c85de4c9 \
            --execute \
            --final-branch ci-replay-dated

      - name: Verify reconstructed commit metadata
        run: |
          test "$(git rev-list --count 8b0e3c6b9dfe1c0e6f7f41cc6c2d98683ad06e2c..ci-replay-dated)" -eq 62
          git log \
            --reverse \
            --format='%H %aI %cI %ae %s' \
            8b0e3c6b9dfe1c0e6f7f41cc6c2d98683ad06e2c..ci-replay-dated
