name: Date Fix Bookkeeping

on:
  push:
    branches:
      - portfolio-rebuild-workspace

permissions:
  contents: write

jobs:
  manifest:
    name: Record corrected replay dates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: portfolio-rebuild-workspace
          fetch-depth: 0

      - name: Rewrite replay manifest dates from verified schedule
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import runpy

          helper = runpy.run_path("scripts/replay_datefix_v2.py", run_name="datefix_config")
          dates = helper["DATES"]
          final_branch = helper["FINAL_BRANCH"]
          path = Path("docs/replay-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entries = data["entries"]
          if len(entries) != len(dates):
              raise SystemExit(f"entry/date mismatch: {len(entries)} != {len(dates)}")
          data["final_branch"] = final_branch
          data["date_plan_version"] = 2
          data["active_days"] = 55
          data["two_commit_days"] = 7
          for entry, timestamp in zip(entries, dates):
              entry["author_date"] = timestamp
              entry["committer_date"] = timestamp
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          python3 -m json.tool docs/replay-manifest.json >/dev/null
          git diff --check

      - name: Commit bookkeeping-only manifest update
        run: |
          git config user.name "Vietsory"
          git config user.email "121284939+VietSory@users.noreply.github.com"
          git add docs/replay-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record irregular replay date plan"
          git push origin HEAD:portfolio-rebuild-workspace
