name: Date Fix Publish

on:
  push:
    branches:
      - portfolio-rebuild-workspace

permissions:
  contents: write

jobs:
  publish:
    name: Rebuild and publish irregular dated history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify protected rollback point
        run: |
          git fetch origin --prune
          test "$(git rev-parse origin/main)" = "7591074f2e1bdebe02f340f9effd6099740631a3"
          test "$(git rev-parse origin/backup/main-before-date-fix)" = "7591074f2e1bdebe02f340f9effd6099740631a3"

      - name: Rebuild irregular dated history
        run: python3 scripts/replay_datefix_v2.py

      - name: Verify final metadata before publish
        run: |
          test "$(git rev-list --count 8b0e3c6b9dfe1c0e6f7f41cc6c2d98683ad06e2c..portfolio-rebuild-dated-v2)" -eq 62
          test "$(git log --format='%ad' --date=format-local:'%Y-%m-%d' 8b0e3c6b9dfe1c0e6f7f41cc6c2d98683ad06e2c..portfolio-rebuild-dated-v2 | sort -u | wc -l)" -eq 55
          test "$(git log -1 --format='%ae' portfolio-rebuild-dated-v2)" = "121284939+VietSory@users.noreply.github.com"

      - name: Publish dated branch and replace main with lease protection
        run: |
          git push origin portfolio-rebuild-dated-v2:refs/heads/portfolio-rebuild-dated-v2
          git push --force-with-lease=refs/heads/main:7591074f2e1bdebe02f340f9effd6099740631a3 origin portfolio-rebuild-dated-v2:refs/heads/main
