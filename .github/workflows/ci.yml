name: CI

on:
  push:
    branches:
      - main
      - portfolio-rebuild-workspace
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend frontend

      - name: Lint correctness rules
        run: ruff check backend frontend

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          APP_ENV: test
          AUTH_SECRET_KEY: ci-secret-key-with-at-least-thirty-two-bytes
          DATABASE_PATH: ${{ runner.temp }}/web-log-analyzer-ci.db
          MODEL_DIR: ${{ runner.temp }}/models
          MAIL_ENABLED: "false"
        run: |
          pytest -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:${{ runner.temp }}/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
