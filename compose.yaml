services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_RELOAD: "false"
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-change-this-secret-at-least-32-bytes}
      CORS_ORIGINS: '["http://localhost:8501"]'
      CORS_ALLOW_CREDENTIALS: "true"
      MAIL_ENABLED: "false"
      DATABASE_PATH: /data/weblog_analyzer.db
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/models
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
      - ./backend/models:/data/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      WEB_LOG_ANALYZER_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.streamlit
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  backend-data:
